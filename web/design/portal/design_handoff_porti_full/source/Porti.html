<meta charset="utf-8" />

<title>Porti — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* COMFAC IT palette — sampled from the logo */
    /* Wordmark: deep navy-charcoal · 'IT' mark: soft lavender-purple */
    --maroon-900: #2a2440; /* legacy alias → purple-900 */
    --maroon-800: #3d3360; /* → purple-800 */
    --maroon-700: #5b4dc8; /* → purple-700 */
    --maroon-50:  #f1eefb; /* → purple-50  */
    --purple-900: #2a2440;
    --purple-800: #3d3360;
    --purple-700: #5b4dc8;
    --purple-600: #7b6fdc;
    --purple-500: #9b91e8;
    --purple-100: #e4dffa;
    --purple-50:  #f1eefb;
    --indigo-700: #4338ca;
    --indigo-600: #5b54e0;
    --indigo-50:  #eef0ff;
    /* Matte ink — sampled from the wordmark, never pure black */
    --ink-900: #272030;
    --ink-700: #3f3849;
    --ink-500: #6e6878;
    --ink-300: #b6b1bf;
    --ink-200: #dcd7e3;
    --ink-100: #ebe7f0;
    /* Matte paper — never pure white */
    --paper:   #f6f4f9;
    --card:    #fbfafd;
    --green-600: #15803d;
    --green-50:  #ecfdf5;
    --amber-600: #b45309;
    --amber-50:  #fef3c7;
    --blue-600:  #1d4ed8;
    --blue-50:   #eff6ff;
    --rose-600:  #be123c;
    --rose-50:   #fff1f2;
    --violet-600:#7c3aed;
    --violet-50: #f5f3ff;
    --orange-600:#c2410c;
    --orange-50: #fff7ed;

    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(20,17,15,.05), 0 1px 1px rgba(20,17,15,.04);
    --shadow:    0 1px 3px rgba(20,17,15,.06), 0 8px 24px -10px rgba(20,17,15,.10);
    --shadow-lg: 0 24px 60px -20px rgba(20,17,15,.18), 0 8px 24px -12px rgba(20,17,15,.10);
  }
  html, body { margin: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; color: var(--ink-900); }
  /* Frame baseline so every artboard inherits the same typographic feel */
  .frame { font-family: 'Inter', system-ui, sans-serif; color: var(--ink-900); background: var(--paper); -webkit-font-smoothing: antialiased; }
  .frame * { box-sizing: border-box; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
</head>
<body>
<div id="root"></div>
